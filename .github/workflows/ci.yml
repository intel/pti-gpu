---

# Build-only check of the aggregate top-level CMake project on a GitHub-hosted
# runner (no GPU, no oneAPI). Components that need oneAPI (icpx), MDAPI,
# GTPin or IGA are skipped.

name: ci

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-lin:
    name: Build tools and samples (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libze-dev opencl-headers \
            ocl-icd-opencl-dev libdrm-dev python3

      - name: Configure
        run: |
          # instcount and memaccess need GTPin. MDAPI is only needed at run
          # time (its headers are downloaded). icpx and IGA samples are
          # skipped automatically when the compiler or library is not found.
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            "-DPTI_GPU_SKIP=instcount;memaccess"

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/pti-install"
