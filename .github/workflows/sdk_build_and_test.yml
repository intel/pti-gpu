name: sdk-build-and-test

on:
  push:
    paths:
      - .github/workflows/sdk_build_and_test.yml
      - .github/actions/linuxTest/action.yml
      - .github/actions/detectChanges/action.yml
      - sdk/**
    branches:
      - master
      - release/**
  pull_request:
    branches:
      - master
      - release/**
    paths:
      - sdk/**
      - .github/workflows/**
      - .github/actions/**
  workflow_dispatch:
  schedule:
    # Daily 4:00 AM UTC - staggered vs nightly_build_and_test (5:30 UTC) so the
    # two heavy scheduled runs do not compete for the same runners (PTI-511)
    - cron: '0 4 * * *'

concurrency:
  group: sdk-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sdk-build-and-test:
    name: Test PTI ${{ matrix.os_id }} ${{ matrix.tags }}

    timeout-minutes: 45

    runs-on: ${{ fromJSON(matrix.tags) }}
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        include:

          - container: ${{ vars.PTI_DOCKER_UBUNTU_24_4_CLIENT_ONEAPI_N }}
            os_id: ${{vars.PTI_PKG_UBUNTU_24_4_CLIENT_ONEAPI_N }}
            preset: linux-icpx-release
            tags: '["self-hosted", "Linux", "pti", "client", "BMG"]'
          - container: ${{ vars.PTI_DOCKER_UBUNTU_24_4_ONEAPI_N }}
            os_id: ${{vars.PTI_PKG_UBUNTU_24_4_ONEAPI_N}}
            preset: linux-icpx-release
            tags: '["self-hosted", "Linux", "pti", "server", "PVC"]'

    container:
      image: ${{ matrix.container }}
      options: --device=/dev/dri --cap-add CAP_PERFMON --shm-size=24G --volume=/dev/dri/by-path:/dev/dri/by-path
      credentials:
        username: ${{ vars.PTI_DOCKER_USER }}
        password: ${{ secrets.PTI_DOCKER_PWD }}

    if: vars.PTI_RUN_LINUX_TESTS == 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Detect code changes
        id: check
        uses: ./.github/actions/detectChanges

      - name: Configure Git to use GitHub PAT
        run: |
          git config --global url."https://user:${{ secrets.pat_pti_tools }}@github.com".insteadOf "https://github.com"
      - name: GitHub Proxy Usage
        uses: ./.github/actions/github-proxy-usage
        with:
          proxy: ${{ vars.PTI_GIT_PROXY }}
          runner-pattern: ${{ vars.PTI_GIT_PROXY_RUNNER_PATTERN }}

      - name: Cache third-party dependency sources
        uses: actions/cache@v4
        with:
          path: sdk/build-*/_deps
          key: ${{ runner.os }}-sdk-deps-${{ hashFiles('sdk/cmake/dependency_pins.cmake') }}

      - name: Build
        if: steps.check.outputs.code == 'true'
        working-directory: sdk
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} -j $(($(nproc)/2))

      - name: Test action
        if: steps.check.outputs.code == 'true'
        uses: ./.github/actions/linuxTest
        with:
          wdir: sdk
          preset: ${{ matrix.preset }}

      - name: Build AddressSanitizer
        if: steps.check.outputs.code == 'true' && contains(fromJSON(matrix.tags), 'server')
        working-directory: sdk
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --preset linux-asan
          cmake --build --preset linux-asan --parallel $(($(nproc)/2))

      - name: Build ThreadSanitizer
        if: steps.check.outputs.code == 'true' && contains(fromJSON(matrix.tags), 'server')
        working-directory: sdk
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --preset linux-tsan
          cmake --build --preset linux-tsan --parallel $(($(nproc)/2))

      - name: Build libFuzzer
        if: steps.check.outputs.code == 'true' && contains(fromJSON(matrix.tags), 'server')
        working-directory: sdk
        run: |
          # To ensure it still builds, run build for fuzz targets until we have
          # proper fuzz testing infrastructure in place.
          source /opt/intel/oneapi/setvars.sh
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz --parallel $(($(nproc)/2))

      #
      # Rocky8 has a problem with this test.
      #
      - name: Test AddressSanitizer
        if: steps.check.outputs.code == 'true' && contains(fromJSON(matrix.tags), 'server')
        working-directory: sdk
        run: |
          source /opt/intel/oneapi/setvars.sh

          #
          # Must skip Rocky8 with more than one GPU because of
          # an unexpected failure as documented in PTI-74
          #
          if [ $(sycl-ls|grep 'ext_oneapi_level_zero:gpu:' -c) -gt 1 ] &&\
             [[ $(cat /etc/redhat-release)  =~ Rocky.*8 ]]; then
            exit 0
          fi
          ctest --preset linux-asan --output-on-failure -L samples

      - name: Test ThreadSanitizer
        if: steps.check.outputs.code == 'true' && contains(fromJSON(matrix.tags), 'server')
        working-directory: sdk
        run: |
          source /opt/intel/oneapi/setvars.sh
          ctest --preset linux-tsan --output-on-failure -L samples


  win-lib-build-and-test:
    name: Test pti-lib on Windows
    runs-on: ${{ fromJSON(matrix.tags) }}

    timeout-minutes: 30

    defaults:
      run:
        shell: cmd
        working-directory: sdk

    strategy:
      matrix:
        include:
          - preset: windows-ci-release
            build-dir: wbr
            tags: '["self-hosted", "Windows", "pti", "client", "BMG"]'

    if: vars.PTI_RUN_TESTS == 1

    steps:
      - name: Clean
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          shopt -s dotglob
          rm -rf ./*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Environment
        run: |
          set /A JOBS=%NUMBER_OF_PROCESSORS%/2
          echo CMAKE_BUILD_PARALLEL_LEVEL=%JOBS%>>%GITHUB_ENV%

      - name: Detect code changes
        id: check
        uses: ./.github/actions/detectChanges

      - name: Cache third-party dependency sources
        if: steps.check.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/_deps
          key: ${{ runner.os }}-${{ runner.name }}-sdk-deps-${{ hashFiles('sdk/cmake/dependency_pins.cmake') }}

      - name: Build
        if: steps.check.outputs.code == 'true'
        run: |
          @echo off
          call "C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          cmake --preset ${{ matrix.preset }} ^
            -DFETCHCONTENT_BASE_DIR=${{ runner.temp }}/_deps
          cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: steps.check.outputs.code == 'true'
        run: |
          @echo off
          call "C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          REM TODO(PTI-88): OverheadRecordsCountsAllOnesViewRecords fails on Windows. Investigation needed. Bug filed.
          ctest --output-on-failure --preset ${{ matrix.preset }} -LE "performance|quarantine" ^
            -E "MainFixtureTest.OverheadRecordsCountsAllOnesViewRecords"

      - name: Quarantined tests # performance and flaky tests
        if: steps.check.outputs.code == 'true'
        continue-on-error: true
        run: |
          @echo off
          call "C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat"
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          ctest --output-on-failure --preset ${{ matrix.preset }} -L "performance|quarantine"
          if %ERRORLEVEL% NEQ 0 (
            echo ::warning::Quarantined tests step failed.
          )
          exit /b 0 ::always exit 0 to keep the green check mark going

